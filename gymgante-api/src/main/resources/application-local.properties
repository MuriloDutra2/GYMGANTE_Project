# Perfil "local" (STG): banco H2 em memória e treino de exemplo no lugar do Gemini.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:gymgante;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
gemini.api.key=local
gemini.mock=true
