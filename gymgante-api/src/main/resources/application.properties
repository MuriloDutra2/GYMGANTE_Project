spring.application.name=gymgante-api

# ---------------------------------------------
# Banco de Dados (PostgreSQL - Neon)
# Credenciais vêm de variáveis de ambiente (nunca commitar senhas)
#   DB_URL (jdbc:postgresql://...), DB_USER, DB_PASSWORD
# ---------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------
# JPA (Hibernate)
# ---------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------------------------------------------
# Servidor (o Render define PORT)
# ---------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------
# Actuator: expõe apenas health
# ---------------------------------------------
management.endpoints.web.exposure.include=health

# ---------------------------------------------
# Integrações
# ---------------------------------------------
gemini.api.key=${GEMINI_API_KEY}

# Origens permitidas no CORS (só necessário se o front ficar em outro domínio)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
