<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - GymGante</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="topo">
        <a class="marca" href="dashboard.html">💪 GymGante</a>
        <nav>
            <a href="dashboard.html" class="ativo">Painel</a>
            <a href="treino.html">Plano completo</a>
            <a href="anamnese.html?update=true">Novo treino</a>
            <a href="#" id="link-sair">Sair</a>
        </nav>
    </header>

    <main class="painel">
        <section class="saudacao">
            <h1 id="saudacao">Olá!</h1>
            <p id="data-hoje"></p>
        </section>

        <div id="carregando" class="carregando">
            <div class="spinner"></div>
            <p>Carregando seu painel...</p>
        </div>

        <div id="erro" class="cartao erro hidden">
            <h2>Não foi possível carregar o painel</h2>
            <p id="erro-msg"></p>
            <button id="btn-tentar" class="btn">Tentar novamente</button>
        </div>

        <div id="conteudo" class="hidden">
            <section class="resumo" id="resumo"></section>

            <section class="cartao" id="hoje"></section>

            <section class="estatisticas" id="estatisticas"></section>

            <section class="cartao">
                <h2>Semana</h2>
                <div class="semana" id="semana"></div>
            </section>

            <section class="cartao">
                <h2>Histórico recente</h2>
                <ul class="historico" id="historico"></ul>
            </section>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
