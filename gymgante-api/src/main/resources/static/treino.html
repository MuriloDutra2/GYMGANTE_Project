<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8fc">
  <title>Plano completo - GymGante</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/caderno.css">
  <link rel="stylesheet" href="css/telas.css">
  <link rel="stylesheet" href="css/painel.css">
  <link rel="stylesheet" href="css/plano.css">
</head>
<body>
  <div class="page">
    <header class="topo">
      <a class="marca" href="dashboard.html" aria-label="GymGante, painel">
        <svg aria-hidden="true"><use href="img/sprite.svg#logo-mark"></use></svg>
        GymGante
      </a>
      <nav aria-label="Principal">
        <a href="dashboard.html">Painel</a>
        <a href="treino.html" aria-current="page">Plano<span class="hide-sm"> completo</span></a>
        <a href="#" id="link-sair">Sair</a>
      </nav>
    </header>

    <main class="painel plano">
      <section class="saudacao">
        <h1>Seu plano completo</h1>
        <div class="plano-acoes">
          <button id="btn-novo-treino" class="btn btn--ghost" type="button">Gerar novo treino</button>
        </div>
      </section>

      <dl class="resumo-linha">
        <div><dt>Nome</dt><dd id="user-nome">-</dd></div>
        <div><dt>Objetivo</dt><dd id="user-objetivo">-</dd></div>
        <div><dt>Frequência</dt><dd id="user-dias">-</dd></div>
        <div><dt>Nível</dt><dd id="user-nivel">-</dd></div>
      </dl>

      <div id="loading" class="painel-carregando" role="status" aria-live="polite">
        <div class="traco" aria-hidden="true"></div>
        <p>Abrindo o seu plano</p>
      </div>

      <div id="treino-container"></div>
    </main>
  </div>

  <!-- Confirmação: o novo treino substitui o atual -->
  <div id="modal-confirm" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-content folha">
      <h2 id="modal-titulo">Gerar um novo treino?</h2>
      <p>O treino atual será substituído. Esta ação não pode ser desfeita.</p>
      <div class="modal-actions">
        <button id="btn-cancel" class="btn btn--ghost" type="button">Cancelar</button>
        <button id="btn-confirm" class="btn btn-primary" type="button">Gerar novo treino</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/muscle.js"></script>
  <script src="js/treino.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
