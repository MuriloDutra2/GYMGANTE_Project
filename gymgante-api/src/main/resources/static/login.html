<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8fc">
  <title>Entrar - GymGante</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/caderno.css">
  <link rel="stylesheet" href="css/telas.css">
</head>
<body>
  <div class="page">
    <header class="topo">
      <a class="marca" href="index.html" aria-label="GymGante, página inicial">
        <svg aria-hidden="true"><use href="img/sprite.svg#logo-mark"></use></svg>
        GymGante
      </a>
      <nav aria-label="Principal">
        <a class="btn btn--ghost" href="cadastro.html">Criar conta</a>
      </nav>
    </header>

    <main class="tela">
      <div class="tela-texto">
        <h1 class="reveal" style="--i:0">Bem-vindo de volta.</h1>
        <p class="lede reveal" style="--i:1">Entre para abrir o treino de hoje e continuar riscando de onde parou.</p>
      </div>

      <form id="form-login" class="folha form-folha reveal" style="--i:2">
        <div class="field">
          <label for="loginIdentifier">Email ou CPF</label>
          <input type="text" id="loginIdentifier" name="loginIdentifier" autocomplete="username" autocapitalize="none" autocorrect="off" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <p class="troca">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </form>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
